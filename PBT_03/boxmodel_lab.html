<html>
<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Box Model Lab</title>

    <link rel="stylesheet" href="css/boxmodel.css">

</head>

<body>

    <h1>Phần 1 — Content-box vs Border-box</h1>

    <div class="wrapper">

        <div class="box box-1">
            Hộp 1 - content-box
        </div>

        <div class="box box-2">
            Hộp 2 - border-box
        </div>

    </div>

    <hr>

    <h1>Phần 2 — Layout 3 cột</h1>

    <h2>Trường hợp KHÔNG dùng border-box</h2>

    <div class="container no-border-box">

        <div class="sidebar">
            Sidebar
        </div>

        <div class="content">
            Content
        </div>

        <div class="ads">
            Ads
        </div>

    </div>

    <h2>Trường hợp CÓ dùng border-box</h2>

    <div class="container border-box">

        <div class="sidebar">
            Sidebar
        </div>

        <div class="content">
            Content
        </div>

        <div class="ads">
            Ads
        </div>

    </div>

</body>

</html>

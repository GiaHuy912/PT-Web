<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản Lý Công Việc</title>

    <link rel="stylesheet" href="css/b2.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Quản Lý Công Việc Cá Nhân</h1>

            <button id="openFormBtn">
                + Thêm Công Việc
            </button>
        </header>

        <!-- Thống kê -->
        <section class="stats">

            <div class="box">
                <h3>Tổng</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="box">
                <h3>Hoàn Thành</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="box">
                <h3>Chưa Hoàn Thành</h3>
                <p id="pendingTasks">0</p>
            </div>

        </section>

        <!-- Thông báo -->
        <div id="message"></div>

        <!-- Danh sách -->
        <section id="taskList" class="task-list">

        </section>

    </div>

    <!-- Popup -->
    <div class="popup" id="popup">

        <div class="popup-content">

            <span class="close-btn" id="closeBtn">&times;</span>

            <h2 id="formTitle">
                Thêm Công Việc
            </h2>

            <form id="taskForm">

                <input 
                    type="text"
                    id="title"
                    placeholder="Tiêu đề công việc"
                    required
                >

                <textarea 
                    id="description"
                    placeholder="Mô tả ngắn"
                ></textarea>

                <input 
                    type="date"
                    id="deadline"
                    required
                >

                <select id="priority">

                    <option value="Thấp">Thấp</option>

                    <option value="Trung Bình">
                        Trung Bình
                    </option>

                    <option value="Cao">Cao</option>

                </select>

                <button type="submit">
                    Lưu Công Việc
                </button>

            </form>

        </div>

    </div>

    <script src="js/b2.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý sinh viên</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Hệ thống quản lý sinh viên</h1>
    </header>

    <section class="top-bar">

        <button id="openModalBtn">
            + Thêm sinh viên
        </button>

    </section>

    <section class="notification-area">

        <p id="message">
            Chào mừng đến với hệ thống quản lý sinh viên
        </p>

    </section>

    <section class="statistics">

        <div class="card">

            <h3>Tổng số sinh viên</h3>

            <p id="totalStudents">0</p>

        </div>

        <div class="card">

            <h3>Điểm trung bình lớp</h3>

            <p id="averageScore">0</p>

        </div>

    </section>

    <section class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Mã sinh viên</th>
                    <th>Họ tên</th>
                    <th>Ngày sinh</th>
                    <th>Lớp học</th>
                    <th>Điểm trung bình</th>
                    <th>Email</th>
                    <th>Hành động</th>
                </tr>
            </thead>

            <tbody id="studentTableBody">

                <!-- Dữ liệu render bằng JavaScript -->

            </tbody>

        </table>

    </section>

    <div class="modal hidden" id="studentModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Thêm sinh viên
                </h2>

                <button id="closeModalBtn">
                    X
                </button>

            </div>

            <form id="studentForm">

                <div class="form-group">

                    <label>Mã sinh viên</label>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Nhập mã sinh viên"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Họ và tên</label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Nhập họ tên"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Ngày sinh</label>

                    <input
                        type="date"
                        id="studentBirthday"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Lớp học</label>

                    <input
                        type="text"
                        id="studentClass"
                        placeholder="Nhập lớp học"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Điểm trung bình</label>

                    <input
                        type="number"
                        id="studentScore"
                        placeholder="Nhập điểm trung bình"
                        min="0"
                        max="10"
                        step="0.1"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="studentEmail"
                        placeholder="Nhập email"
                        required
                    >

                </div>

                <div class="form-buttons">

                    <button type="submit" id="saveBtn">
                        Lưu
                    </button>

                    <button
                        type="button"
                        id="cancelBtn"
                    >
                        Hủy
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>

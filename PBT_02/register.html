<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>

<form action="#" method="POST">

    <fieldset>
        <legend>Thông tin cá nhân</legend>

        <label for="fullname">Họ tên:</label><br>
        <input type="text" id="fullname" name="fullname"
               placeholder="Nhập họ tên"
               required minlength="2" maxlength="50"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"
               placeholder="Nhập email"
               required><br><br>

        <label for="phone">Số điện thoại:</label><br>
        <input type="tel" id="phone" name="phone"
               placeholder="Nhập 10 chữ số"
               pattern="[0-9]{10}"
               required><br><br>

        <label for="dob">Ngày sinh:</label><br>
        <input type="date" id="dob" name="dob"
               required><br><br>
    </fieldset>

    <fieldset>
        <legend>Tài khoản</legend>

        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username"
               placeholder="3-20 ký tự (chữ, số, _)"
               pattern="[A-Za-z0-9_]{3,20}"
               required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"
               placeholder="Ít nhất 8 ký tự"
               minlength="8"
               required><br><br>

        <label for="confirm">Xác nhận password:</label><br>
        <input type="password" id="confirm" name="confirm"
               placeholder="Nhập lại mật khẩu"
               minlength="8"
               required><br><br>
    </fieldset>

    <fieldset>
        <legend>Thông tin giao hàng</legend>

        <label for="city">Thành phố:</label><br>
        <select id="city" name="city" required>
            <option value="">Chọn thành phố</option>
            <option>Hà Nội</option>
            <option>TP.HCM</option>
        </select><br><br>

        <label for="district">Quận/Huyện:</label><br>
        <select id="district" name="district" required>
            <option value="">Chọn quận/huyện</option>
            <option>Quận HM</option>
            <option>Quận 1</option>
        </select><br><br>

        <label for="address">Địa chỉ chi tiết:</label><br>
        <textarea id="address" name="address"
                  placeholder="Nhập địa chỉ"
                  rows="3"
                  required></textarea><br><br>

        <p>Giới tính:</p>

        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Nam</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Nữ</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Khác</label><br><br>
    </fieldset>

    <!-- Điều khoản -->
    <input type="checkbox" id="terms" name="terms" required>
    <label for="terms">Tôi đồng ý điều khoản</label><br><br>

    <button type="submit">Đăng ký</button>
    <button type="reset">Nhập lại</button>

</form>

<script>
const today = new Date().toISOString().split("T")[0];
document.getElementById("dob").max = today;
</script>

</body>
</html>

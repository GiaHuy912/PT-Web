<html>
<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Grid Layout</title>

    <link rel="stylesheet" href="css/grid.css">

</head>

<body>

    <div class="container">

        <!-- HEADER -->

        <header>
            <h1>GiaHuy Store</h1>
        </header>

        <!-- HERO -->

        <section class="hero">
            <h2>Sống dai thành huyền thoại</h2>
        </section>

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h2>Bộ lọc</h2>

            <label><input type="checkbox"> PUBG</label><br>
            <label><input type="checkbox"> Free Fire</label><br>
            <label><input type="checkbox"> Valorant</label><br>
            <label><input type="checkbox"> Liên Quân</label>

        </aside>

        <!-- MAIN -->

        <main class="products">

            <div class="card featured">
                <img src="https://i1.kknews.cc/P35OMUHu26V-lIVBmDmP_foJr-QykXXDQoGDfqY/0.jpg" alt="">
                <h3>M416</h3>
                <p>99.999.000đ</p>
            </div>

            <div class="card">
                <img src="https://tse1.mm.bing.net/th/id/OIP.ijytpjAqCg9GOcjuPjQVFQHaEK?pid=Api&P=0&h=180" alt="">
                <h3>AUG</h3>
                <p>20.000.000đ</p>
            </div>

            <div class="card">
                <img src="https://tse1.mm.bing.net/th/id/OIP.kq-mJHgyfmOk5GaE7T8DeQHaHa?pid=Api&P=0&h=180" alt="">
                <h3>M24</h3>
                <p>30.000.000đ</p>
            </div>

            <div class="card">
                <img src="https://imgt.taimienphi.vn/cf/Images/li/2018/9/11/huong-dan-su-dung-luu-dan-trong-pubg-mobile-hieu-qua-nhat-3.jpg" alt="">
                <h3>Smoke</h3>
                <p>50.000.000đ</p>
            </div>

            <div class="card">
                <img src="https://www.shootingillustrated.com/media/dcnfrrwn/bugle.jpg" alt="">
                <h3>Famas</h3>
                <p>18.000.000đ</p>
            </div>

            <div class="card">
                <img src="https://staticg.sportskeeda.com/editor/2021/11/1ee1a-16371222121830-1920.jpg" alt="">
                <h3>Chô Nô</h3>
                <p>15.000.000đ</p>
            </div>

        </main>

        <!-- ADS -->

        <aside class="ads">

            <h2>Quảng cáo</h2>

            <img src="https://placehold.co/180x500" alt="">

        </aside>

        <!-- FOOTER -->

        <footer>
            <p>© 2026 GiaHuy Store</p>
        </footer>

    </div>

</body>

</html>
